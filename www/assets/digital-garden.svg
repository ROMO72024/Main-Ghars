<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" role="img" aria-labelledby="title desc">
  <title id="title">منظومة غرس الرقمية</title>
  <desc id="desc">نبتة غرس مضيئة تحيط بها بطاقات الأنظمة المدرسية المتصلة</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset="1" stop-color="#f7e8f0" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#cbe77e"/>
      <stop offset="1" stop-color="#7ea342"/>
    </linearGradient>
    <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d0438f"/>
      <stop offset="1" stop-color="#84114f"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#430b2d" flood-opacity=".24"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="263" cy="282" rx="157" ry="17" fill="#4b0b32" opacity=".18"/>
  <circle cx="260" cy="154" r="115" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="2" stroke-dasharray="4 12"/>
  <circle cx="260" cy="154" r="88" fill="#ffffff" opacity=".045"/>

