    <rect x="197" y="59" width="126" height="186" rx="28" fill="#ffffff" fill-opacity=".43" stroke="#ffffff" stroke-opacity=".65"/>
    <rect x="235" y="68" width="50" height="6" rx="3" fill="#8c1a5c" opacity=".23"/>
